[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "coreimage"
version = "27.0.0"
edition = "2021"
authors = ["arlomu"]
description = "Image loading, transform, filter, composite and analysis library for TontooOS (CoreText integrated)"
license = "TCL"
repository = "https://github.com/TontooOS/CoreImage"
keywords = ["tontoo", "image", "png", "jpeg", "webp", "filter"]
categories = ["multimedia", "graphics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["png", "jpeg", "gif", "bmp"] }
imageproc = "0.25"
ab_glyph = "0.2"
kamadak-exif = "0.5"
coretext = { package = "coretext", path = "../CoreText" }

[dev-dependencies]
tempfile = "3"
